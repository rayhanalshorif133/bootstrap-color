<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Placeholder</title>
  <style>
    body {
      margin: 0;
    }
  </style>
</head>
<body>
<script>
  // Get query parameters
  const params = new URLSearchParams(window.location.search);
  const size = parseInt(params.get("size")) || 15;
  let color = params.get("color") || "000000";

  // Ensure valid hex color
  if (!color.startsWith("#")) {
    color = "#" + color;
  }

  // Create canvas
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, size, size);

  // Convert to PNG
  const pngData = canvas.toDataURL("image/png");

  // Force browser to show only PNG image
  document.write("<img src='" + pngData + "' width='" + size + "' height='" + size + "' />");

  // If used inside <img src="..."> → auto redirect
  if (window.top === window.self) {
    // Do nothing (show image in browser if opened directly)
  } else {
    // If embedded in README, force pure PNG
    window.location.replace(pngData);
  }
</script>
</body>
</html>
