<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Color Box Generator</title>
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const size = parseInt(params.get("size")) || 12;
  const color = params.get("color") || "000000";

  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = `#${color}`;
  ctx.fillRect(0, 0, size, size);

  const imgData = canvas.toDataURL("image/png");

  document.body.innerHTML = `<img src="${imgData}" width="${size}" height="${size}" alt="color-box">`;
</script>
</body>
</html>
